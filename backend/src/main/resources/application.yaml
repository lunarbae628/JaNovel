server:
  shutdown: graceful

springdoc:
  default-produces-media-type: application/json

spring:
  application:
    name: janovel
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  config:
    import: "optional:file:./.env[.properties]"
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
