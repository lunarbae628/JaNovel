<script>
(()=>{

function mountEditor(root,context){
const editorId=root.id||('application-editor-'+root.dataset.application);root.id=editorId;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const texts={
 q1a:'문서를 믿고 다시 찾을 수 있는 서비스를 만드는 일에 관심이 있습니다.\n\n문서 관리 프로젝트에서 데이터 저장 기능을 개발했습니다. 저장 이후에도 기록이 정확하게 남는지 확인하는 일이 중요하다고 느꼈습니다.\n\n이 경험을 문서 저장과 변경 이력을 다루는 업무로 이어가고 싶습니다.',
 q1b:'문서를 믿고 다시 찾을 수 있는 서비스를 만드는 일에 관심이 있습니다.\n\n문서 관리 프로젝트에서 정상 저장뿐 아니라 실패한 요청이 남기는 데이터까지 확인했습니다. 생성 대상을 먼저 기록하고 보상 경로를 마련하며, 사용자가 맡긴 기록을 끝까지 관리하는 일에 흥미를 느꼈습니다.\n\n이 경험을 문서 저장과 변경 이력을 다루는 업무로 이어가고 싶습니다.',
 q2:'서로 다른 저장소에 데이터를 저장할 때 일부 작업만 성공하는 상황을 다뤘습니다.\n\n실패한 요청의 데이터를 정리할 수 있도록 생성할 데이터의 식별자를 먼저 기록하고, 보상 작업을 재시도하는 구조를 설계했습니다.'
};
function question(id,title,prompt,versions,parent){return {id,title,prompt,versions,parent,draft:versions[parent].text,left:0,right:'draft',nextVersion:versions.length===1?2:3,messages:[],pending:null,review:null,applied:new Set(),composer:'',view:'write',branchLane:null,merge:null,recordForm:null,branches:Object.fromEntries([...new Set(versions.map(v=>v.lane))].map(lane=>[lane,{name:lane?'분기 '+lane:'기본',description:''}]))};}
const demoItems=[
 question('motivation','지원동기','지원한 이유를 작성해 주세요.',[
 {label:'v1',note:'첫 초안',parent:null,lane:0,text:texts.q1a},
 {label:'v2',note:'경험 보강',parent:0,lane:0,text:texts.q1b},
 {label:'v2-A',note:'다른 도입',parent:0,lane:1,text:texts.q1a.replace('문서를 믿고 다시 찾을 수 있는 서비스를 만드는 일에 관심이 있습니다.','수정한 기록이 쌓여도 정확한 제출본을 찾을 수 있는 서비스를 만들고 싶습니다.')}
 ],1),
 question('problem','문제 해결','문제를 해결한 경험을 작성해 주세요.',[{label:'v1',note:'첫 초안',parent:null,lane:0,text:texts.q2}],0)
];
const editorContext=typeof context==='undefined'?null:context;
const items=editorContext?.questions?editorContext.questions.map((q,i)=>({...question('registered-'+i,q.prompt.length>12?q.prompt.slice(0,12)+'…':q.prompt,q.prompt,[{label:'v1',note:'첫 초안',parent:null,lane:0,text:''}],0),limit:q.limit,spaces:q.spaces})):demoItems;
const measure=(q,text)=>count(q.spaces===false?text.replace(/\s/g,''):text);
const countLabel=q=>`${measure(q,q.draft)}${q.limit?' / '+q.limit:items===demoItems?' / 700':''}자`;
const s={q:0,mobile:'write',notice:'',leftClosed:false,rightClosed:false};let requestSeq=0;
const current=()=>items[s.q],count=t=>Array.from(t).length;
const compactMedia=window.matchMedia('(max-width:650px)');compactMedia.addEventListener('change',()=>render());
const branchInfo=q=>q.branches[q.branchLane??q.versions[q.parent].lane];
function questionNav(){return `<nav class="p-question-list" aria-label="문항 선택">${items.map((x,i)=>`<button type="button" class="p-question cursor-interaction" data-question="${i}" aria-pressed="${s.q===i}" aria-label="Q${i+1} ${esc(x.prompt)}" data-tooltip="${esc(x.prompt)}">Q${i+1}</button>`).join('')}</nav>`;}
function highlight(a,b){
 const x=a.match(/\s+|[^\s]+/gu)||[],y=b.match(/\s+|[^\s]+/gu)||[];
 const d=Array.from({length:x.length+1},()=>new Uint16Array(y.length+1));for(let i=x.length-1;i>=0;i--)for(let j=y.length-1;j>=0;j--)d[i][j]=x[i]===y[j]?1+d[i+1][j+1]:Math.max(d[i+1][j],d[i][j+1]);
 let i=0,j=0,out='',added='';const flush=()=>{if(added){out+='<ins>'+esc(added)+'</ins>';added='';}};
 while(i<x.length||j<y.length){if(i<x.length&&j<y.length&&x[i]===y[j]){flush();out+=esc(y[j++]);i++;}else if(j<y.length&&(i===x.length||d[i][j+1]>=d[i+1][j]))added+=y[j++];else i++;}flush();return out;
}
function options(q,value,withDraft){return q.versions.map((v,i)=>`<option value="${i}" ${String(value)===String(i)?'selected':''}>${esc(v.label+(v.name?' · '+v.name:''))}</option>`).join('')+(withDraft?`<option value="draft" ${value==='draft'?'selected':''}>작성 중</option>`:'');}
function snapshotLabel(q,text){const i=q.versions.findLastIndex(v=>v.text===text);return i<0?'작성 중':q.versions[i].label;}
const dirty=q=>q.draft!==q.versions[q.parent].text||q.branchLane!==null;
function saveVersion(q,note,meta={}){q.versions.push({label:`v${q.nextVersion++}`,note,name:meta.name||'',description:meta.description||'',parent:q.parent,lane:q.branchLane??q.versions[q.parent].lane,text:q.draft});q.parent=q.versions.length-1;q.branchLane=null;}
const nodeInfo=(q,v)=>[v.label,v.name||v.note,v.description,v.lane?q.branches[v.lane]?.name:'',v.lane?q.branches[v.lane]?.description:''].filter(Boolean).join(' · ');
function graph(q){
 const nodes=q.versions.map((v,i)=>({...v,index:i}));nodes.push({label:'작성 중',name:q.branchLane!==null?branchInfo(q).name:'',description:branchInfo(q).description,note:q.branchLane!==null?'새 분기':'현재 초안',parent:q.parent,lane:q.branchLane??q.versions[q.parent].lane,index:'draft'});
 const paths=nodes.flatMap((n,i)=>[n.parent,n.mergeParent].filter(p=>p!==null&&p!==undefined).map(parent=>{const p=nodes[parent],x=15+n.lane*28,px=15+p.lane*28,y=30+i*64,py=30+parent*64;return `<path data-edge-from="${parent}" data-edge-to="${n.index}" d="M ${px} ${py} C ${px} ${py+32}, ${x} ${y-32}, ${x} ${y}"/>`;})).join('');
 return `<h2 class="p-section-title">Q${s.q+1} 버전</h2><div class="p-graph" style="height:${nodes.length*64+10}px" aria-label="Q${s.q+1} ${esc(q.title)} 버전 그래프"><svg aria-hidden="true" style="color:#bfc2c9"><g fill="none" stroke="currentColor" stroke-width="2">${paths}</g></svg>${nodes.map((v,i)=>`<button type="button" class="p-node cursor-interaction ${v.index==='draft'?'p-working':''}" style="top:${i*64+6}px;left:${8+v.lane*28}px;width:calc(100% - ${12+v.lane*28}px)" data-version="${v.index}" aria-label="Q${s.q+1} ${esc(nodeInfo(q,v))}" data-tooltip="${esc(nodeInfo(q,v))}" aria-pressed="${v.index==='draft'?q.view==='write':q.view==='history'&&q.left===v.index}"><span>${esc(v.label)}</span><small>${esc(v.name||v.note)}</small></button>`).join('')}</div>`;
}
function render(){
 if(!items.length){renderEmpty();return;}
 const q=current();
 root.innerHTML=`<header class="p-shell-head">${root.returnToOverview?'<button type="button" class="p-back cursor-interaction" data-action="back-to-list" aria-label="지원 현황으로 돌아가기">← 지원 현황</button>':''}<div class="p-company-info"><span class="p-company">${esc(context.company)}</span><span class="p-job">${esc(context.role)}</span></div><span class="p-apply-slot">${editorApplyLink()}</span></header><div class="p-mobile-nav" aria-label="작업 영역">${compactMedia.matches?questionNav():''}${[['graph','버전'],['write','작성'],['chat','채팅']].map(([v,l])=>`<button class="cursor-interaction" data-mobile="${v}" aria-pressed="${s.mobile===v}">${l}</button>`).join('')}</div>
 <div class="p-layout" data-mobile="${s.mobile}" data-left-closed="${s.leftClosed}" data-right-closed="${s.rightClosed}"><aside class="p-versions" aria-label="선택 문항의 버전"><div class="p-pane-heading"><span class="p-pane-label">버전 기록</span>${foldButton('left',s.leftClosed)}</div><div class="p-version-content" id="${editorId}-versions">${graph(q)}</div></aside>
 <section class="p-center" aria-label="자소서 작성과 비교"><div class="p-editor-toolbar">${compactMedia.matches?'':questionNav()}<div class="p-tools">${q.view==='merge'?'<button class="cursor-interaction" data-action="cancel-merge">병합 취소</button>':`${q.view!=='write'?'<button class="cursor-interaction" data-action="write">← 작성</button>':'<button class="cursor-interaction" data-action="history">비교</button>'}<button class="cursor-interaction" data-action="merge" ${q.versions.length<2?'disabled data-tooltip="스냅샷이 두 개 이상 필요해요"':''}>병합</button>${q.view==='write'?'<button class="p-primary cursor-interaction" data-action="save">스냅샷</button>':''}`}</div></div>
 <main>${q.view==='merge'?mergeView(q):q.view==='write'?writer(q):comparison(q)}</main><div class="p-notice" role="status" aria-live="polite">${esc(s.notice)}</div></section>
 <aside class="p-chat-pane" aria-label="AI 피드백 채팅"><div class="p-chat-head">${foldButton('right',s.rightClosed)}<span class="p-pane-label">AI 채팅</span><span class="p-question-tag">Q${s.q+1}</span></div><div class="p-chat-content" id="${editorId}-chat">${chat(q)}</div></aside></div>${recordDialog(q)}`;
 bind();
 if(q.recordForm){const dialog=root.querySelector('.p-record-dialog');dialog.showModal();dialog.querySelector(`[data-record-field="${q.recordForm.focusField||'name'}"]`).focus();}
 if(window.lucide)lucide.createIcons({attrs:{width:16,height:16}});
}

const pad=n=>String(n).padStart(2,'0');
const parsed=date=>date.split('-').map(Number);
const iso=(year,month,day)=>`${year}-${pad(month)}-${pad(day)}`;
const dateLabel=date=>{const [y,m,d]=parsed(date);return `${m}.${pad(d)} (${['일','월','화','수','목','금','토'][new Date(Date.UTC(y,m-1,d)).getUTCDay()]})`;};
const visibleApps=()=>apps.filter(a=>state.filter==='전체'||a.status===state.filter);
const find=id=>apps.find(a=>a.id===id);
function allEvents(){return [...apps.filter(a=>a.deadline).map(a=>({id:'deadline-'+a.id,app:a.id,kind:'마감',date:a.deadline,time:a.time,title:'지원 마감'})),...schedules];}
function events(){const ids=new Set(visibleApps().map(a=>a.id));return allEvents().filter(e=>ids.has(e.app));}
function statusOptions(a){return `<optgroup label="지원 상태">${statuses.map(x=>`<option value="${x}" ${a.status===x&&!a.currentStage?'selected':''}>${x}</option>`).join('')}</optgroup>${a.stages?.length?`<optgroup label="채용 절차">${a.stages.map(s=>`<option value="stage:${s.id}" ${a.currentStage===s.id?'selected':''}>${escapeText(s.name)}</option>`).join('')}</optgroup>`:''}`;}
function upcoming(a){const next=allEvents().filter(e=>e.app===a.id&&e.kind!=='마감'&&e.date>='2026-11-01').sort((x,y)=>x.date.localeCompare(y.date))[0];return next?`${dateLabel(next.date)} ${next.kind}`:'—';}
function deadline(a){return a.rolling?'상시채용':a.deadline?`<span class="ah-date">${dateLabel(a.deadline)}</span><span class="ah-sub">${a.time||'시간 미정'}</span>`:'날짜 미확인';}
function list(){const rows=visibleApps();return `<table class="ah-table"><thead><tr><th scope="col">회사 · 직무</th><th scope="col">마감</th><th scope="col">상태</th><th scope="col">다음 일정</th></tr></thead><tbody>${rows.map(a=>`<tr><td><button type="button" class="ah-company cursor-interaction" data-open="${a.id}">${escapeText(a.company)}</button><span class="ah-role">${escapeText(a.role)}</span>${a.source?`<span class="ah-posting-actions"><button type="button" class="ah-button ah-posting cursor-interaction" data-posting="${a.id}">공고 보기</button>${applicationLink(a.applicationUrl)}</span>`:''}</td><td>${deadline(a)}</td><td><select class="ah-select ah-status" aria-label="${escapeText(a.company)} 지원 상태" data-status="${a.id}">${statusOptions(a)}</select></td><td>${upcoming(a)}</td></tr>`).join('')}</tbody></table>${rows.length?'':'<div class="ah-empty">해당 상태의 지원 건이 없습니다.</div>'}`;}
function agenda(){const selected=events().filter(e=>e.date===state.selected).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));return `<aside class="ah-agenda" aria-label="선택한 날짜의 일정"><h2>${dateLabel(state.selected)}</h2>${selected.length?selected.map(e=>{const a=find(e.app);return `<div class="ah-agenda-item"><button type="button" class="ah-company cursor-interaction" data-open="${a.id}">${escapeText(a.company)}</button><div class="ah-agenda-meta">${e.kind} · ${e.time||'시간 미정'}</div><span>${escapeText(e.title)}</span></div>`;}).join(''):'<div class="ah-agenda-empty">등록된 일정이 없습니다.</div>'}<button class="ah-button ah-link cursor-interaction" data-action="add">이 날짜에 일정 추가</button></aside>`;}
function calendar(){const [year,month]=state.month.split('-').map(Number),start=new Date(Date.UTC(year,month-1,1)),first=new Date(start);first.setUTCDate(1-start.getUTCDay());const lastDay=new Date(Date.UTC(year,month,0)).getUTCDate(),cells=Math.ceil((start.getUTCDay()+lastDay)/7)*7;
const days=Array.from({length:cells},(_,i)=>{const d=new Date(first);d.setUTCDate(first.getUTCDate()+i);const date=iso(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate()),ev=events().filter(e=>e.date===date),inside=date.startsWith(state.month);return `<button type="button" class="ah-day cursor-interaction ${inside?'':'ah-outside'}" data-day="${date}" aria-pressed="${state.selected===date}" aria-label="${date} 일정 ${ev.length}개"><span class="ah-day-number">${d.getUTCDate()}</span>${ev.slice(0,2).map(e=>`<span class="ah-event" data-kind="${e.kind}" data-tooltip="${escapeText(find(e.app).company+' '+e.kind+' '+(e.time||'시간 미정'))}">${e.kind}·${escapeText(find(e.app).company)}</span>`).join('')}${ev.length>2?`<span class="ah-event">+${ev.length-2}</span>`:''}</button>`;});
const unknown=visibleApps().filter(a=>!a.deadline&&!a.rolling),rolling=visibleApps().filter(a=>a.rolling);
return `<div class="ah-calendar-layout"><section aria-label="월간 지원 일정"><div class="ah-month-bar"><span class="ah-month-title">${year}년 ${month}월</span><div class="ah-row"><button class="ah-button cursor-interaction" data-shift="-1" aria-label="이전 달">←</button><button class="ah-button cursor-interaction" data-shift="1" aria-label="다음 달">→</button></div></div><div class="ah-weekdays" aria-hidden="true">${['일','월','화','수','목','금','토'].map(x=>`<span>${x}</span>`).join('')}</div><div class="ah-month">${days.join('')}</div></section>${agenda()}</div>${unknown.length||rolling.length?`<section class="ah-undated" aria-label="날짜가 정해지지 않은 공고">${unknown.length?`<h2>마감일 미확인</h2><div class="ah-row">${unknown.map(a=>`<button class="ah-button ah-link cursor-interaction" data-open="${a.id}">${escapeText(a.company)}</button>`).join('')}</div>`:''}${rolling.length?`<h2>상시채용</h2><div class="ah-row">${rolling.map(a=>`<button class="ah-button ah-link cursor-interaction" data-open="${a.id}">${escapeText(a.company)}</button>`).join('')}</div>`:''}</section>`:''}`;
}
function scheduleForm(){return `<section class="ah-form" aria-label="일정 추가"><div class="ah-fields"><label>지원 건<select class="ah-select" data-field="app">${apps.map(a=>`<option value="${a.id}">${escapeText(a.company)}</option>`).join('')}</select></label><label>종류<select class="ah-select" data-field="kind"><option>면접</option><option>과제</option><option>기타</option></select></label><label>일정명<input class="ah-input" data-field="title" placeholder="예: 1차 면접" maxlength="60"></label><label>날짜<input class="ah-input" data-field="date" type="date" value="${state.selected}"></label><label>시간 (선택)<input class="ah-input" data-field="time" type="time"></label></div><div class="ah-error" role="alert">${state.formError}</div><div class="ah-row"><button class="ah-button ah-primary cursor-interaction" data-action="save-event">저장</button><button class="ah-button cursor-interaction" data-action="cancel">취소</button></div></section>`;}
function renderHome(){home.innerHTML=`<div class="ah-heading"><h1>지원 현황</h1><span class="ah-demo">예시 데이터</span><button type="button" class="ah-button ah-primary cursor-interaction" data-action="register">+ 공고 등록</button></div><div class="ah-toolbar"><div class="ah-row"><button class="ah-button ah-view cursor-interaction" data-view="list" aria-pressed="${state.view==='list'}">목록</button><button class="ah-button ah-view cursor-interaction" data-view="calendar" aria-pressed="${state.view==='calendar'}">캘린더</button></div><div class="ah-row"><label class="ah-label">상태<select class="ah-select" data-filter><option>전체</option>${statuses.map(x=>`<option ${state.filter===x?'selected':''}>${x}</option>`).join('')}</select></label><button class="ah-button cursor-interaction" data-action="add">일정 추가</button></div></div>${state.form?scheduleForm():''}${state.view==='list'?list():calendar()}<div class="ah-feedback" role="status" aria-live="polite">${escapeText(state.notice)}</div>`;bindHome();}
function openEditor(id){const a=find(id);state.active=id;home.hidden=true;editing.hidden=false;editorHosts.querySelectorAll('.application-editor').forEach(x=>x.hidden=true);let el=editorHosts.querySelector(`[data-application="${id}"]`);if(!el){el=document.createElement('div');el.className='application-editor';el.dataset.application=id;el.returnToOverview=()=>{home.hidden=false;editing.hidden=true;renderHome();};editorHosts.append(el);mountEditor(el,a);}el.hidden=false;}
function bindHome(){home.querySelectorAll('[data-posting]').forEach(el=>el.onclick=()=>showPosting(el.dataset.posting));home.querySelectorAll('button').forEach(el=>el.type='button');home.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>openEditor(el.dataset.open));home.querySelectorAll('[data-view]').forEach(el=>el.onclick=()=>{state.view=el.dataset.view;renderHome();});home.querySelector('[data-filter]').onchange=e=>{state.filter=e.target.value;state.notice='';renderHome();};home.querySelectorAll('[data-status]').forEach(el=>el.onchange=()=>{const a=find(el.dataset.status);if(el.value.startsWith('stage:')){a.currentStage=el.value.slice(6);a.status='전형 진행';}else{a.status=el.value;a.currentStage=null;}state.notice=a.company+' 상태 변경됨';renderHome();});home.querySelectorAll('[data-day]').forEach(el=>el.onclick=()=>{state.selected=el.dataset.day;state.month=state.selected.slice(0,7);renderHome();});home.querySelectorAll('[data-shift]').forEach(el=>el.onclick=()=>{const [y,m]=state.month.split('-').map(Number),d=new Date(Date.UTC(y,m-1+Number(el.dataset.shift),1));state.month=iso(d.getUTCFullYear(),d.getUTCMonth()+1,1).slice(0,7);state.selected=state.month+'-01';renderHome();});home.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>{const action=el.dataset.action;if(action==='register'){showRegistration();return;}if(action==='add'){state.form=true;state.formError='';}if(action==='cancel'){state.form=false;state.formError='';}if(action==='save-event'){const field=n=>home.querySelector(`[data-field="${n}"]`).value.trim(),date=field('date'),title=field('title');if(!date||!title){state.formError='일정명과 날짜를 입력해 주세요.';home.querySelector('.ah-error').textContent=state.formError;return;}schedules.push({id:nextSchedule++,app:field('app'),kind:field('kind'),date,time:field('time')||null,title});state.form=false;state.formError='';state.view='calendar';state.selected=date;state.month=date.slice(0,7);state.filter='전체';state.notice='일정 저장됨';}renderHome();});}

,`Q${i+1} 삭제`,`data-question-index="${i}"`)}</div><textarea class="ah-input" aria-label="Q${i+1} 문항" data-q-prompt="${i}">${escapeText(q.prompt)}</textarea><div class="ar-question-options"><label class="ar-label">최대<input class="ah-input" type="number" min="1" max="50000" placeholder="미확인" aria-label="Q${i+1} 글자 수 제한" data-q-limit="${i}" value="${q.limit??''}">자</label><label class="ar-check"><input type="checkbox" data-q-spaces="${i}" ${q.spaces?'checked':''}>공백 포함</label></div></div>`).join('')}<button type="button" class="ah-button ah-link cursor-interaction" data-reg="add-question">+ 문항 추가</button></section><div class="ar-error" role="alert">${escapeText(reg.error)}</div><div class="ar-bottom"><button type="button" class="ah-button cursor-interaction" data-reg="back">← 입력으로</button><div class="ah-row"><button type="button" class="ah-button cursor-interaction" data-reg="save">공고 저장</button><button type="button" class="ah-button ah-primary cursor-interaction" data-reg="write">저장 후 작성</button></div></div></form></div>`;}
function renderRegistration(){registration.innerHTML=`<div class="ar-page"><header class="ar-top"><button type="button" class="ah-button cursor-interaction" data-reg="close">← 지원 현황</button><h1>${reg.step==='input'?'공고 등록':'공고 확인'}</h1><span class="ar-meta">${reg.step==='input'?'화면 미리보기':reg.sample?'예시 추출 결과':'직접 입력'}</span><span class="ar-apply-slot">${reg.step==='review'?applicationLink(reg.data.applicationUrl):''}</span></header>${reg.step==='input'?registrationInput():registrationReview()}</div>`;bindRegistration();bindFacts();if(window.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
function regError(message){reg.error=message;registration.querySelector('.ar-error').textContent=message;}
function validUrl(v){try{return ['https:','http:'].includes(new URL(v).protocol);}catch{return false;}}
function registerPosting(write){const d=reg.data;if(d.applicationUrl.trim()&&!validUrl(d.applicationUrl)){regError('지원 링크는 http 또는 https 주소로 입력해 주세요.');return;}if(!d.company.trim()||!d.role.trim()){regError('회사명과 직무를 입력해 주세요.');return;}if(d.stages.some(s=>!s.name.trim())){regError('추가한 단계의 이름을 입력하거나 삭제해 주세요.');return;}if(d.questions.some(q=>!q.prompt.trim())){regError('추가한 문항을 입력하거나 삭제해 주세요.');return;}if(d.questions.some(q=>q.limit!==null&&(!Number.isInteger(q.limit)||q.limit<1||q.limit>50000))){regError('글자 수 제한은 1~50,000 사이의 정수로 입력해 주세요.');return;}const a={...structuredClone(d),duties:d.duties.map(x=>x.trim()).filter(Boolean),requirements:d.requirements.map(x=>x.trim()).filter(Boolean),id:'new-'+(++regSeq),company:d.company.trim(),role:d.role.trim(),status:'관심',currentStage:null,source:structuredClone(regSource()),deadline:d.rolling?null:d.deadline||null,time:d.rolling||!d.deadline?null:d.time||null};apps.unshift(a);state.filter='전체';state.view='list';state.notice=a.company+' 공고 저장됨';registration.hidden=true;reg={mode:'link',step:'input',url:'',text:'',files:[],sample:false,data:null,error:''};if(write)openEditor(a.id);else{home.hidden=false;editing.hidden=true;renderHome();}}
function bindRegistration(){registration.querySelector('form')?.addEventListener('submit',e=>e.preventDefault());registration.querySelectorAll('[data-mode]').forEach(el=>el.onclick=()=>{reg.mode=el.dataset.mode;reg.sample=false;reg.data=null;reg.error='';renderRegistration();});registration.querySelectorAll('[data-source]').forEach(el=>el.oninput=()=>{reg[el.dataset.source]=el.value;reg.sample=false;reg.data=null;});const files=registration.querySelector('[data-files]');if(files)files.onchange=async()=>{const selected=Array.from(files.files);if(selected.some(f=>!['image/png','image/jpeg','image/webp'].includes(f.type))){regError('PNG, JPG, WEBP 이미지를 선택해 주세요.');return;}reg.files=await Promise.all(selected.map(f=>new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve({name:f.name,data:reader.result});reader.onerror=reject;reader.readAsDataURL(f);}))).catch(()=>null);if(!reg.files){reg.files=[];regError('이미지를 읽지 못했습니다. 다시 선택해 주세요.');return;}reg.sample=false;reg.data=null;renderRegistration();};registration.querySelectorAll('[data-reg-field]').forEach(el=>{const k=el.dataset.regField;el.oninput=()=>{reg.data[k]=el.type==='checkbox'?el.checked:el.value;if(k==='applicationUrl')registration.querySelector('.ar-apply-slot').innerHTML=applicationLink(el.value);};if(k==='rolling'||k==='deadline')el.onchange=()=>{reg.data[k]=el.type==='checkbox'?el.checked:el.value;renderRegistration();};});registration.querySelectorAll('[data-stage-name]').forEach(el=>el.oninput=()=>{reg.data.stages.find(s=>s.id===el.dataset.stageName).name=el.value;});registration.querySelectorAll('[data-q-prompt]').forEach(el=>el.oninput=()=>{reg.data.questions[Number(el.dataset.qPrompt)].prompt=el.value;});registration.querySelectorAll('[data-q-limit]').forEach(el=>el.oninput=()=>{reg.data.questions[Number(el.dataset.qLimit)].limit=el.value===''?null:Number(el.value);});registration.querySelectorAll('[data-q-spaces]').forEach(el=>el.onchange=()=>{reg.data.questions[Number(el.dataset.qSpaces)].spaces=el.checked;});registration.querySelectorAll('[data-reg]').forEach(el=>el.onclick=()=>{const action=el.dataset.reg;reg.error='';if(action==='add-fact'){reg.data[el.dataset.factField].push('');renderRegistration();const fields=registration.querySelectorAll(`textarea[data-fact-field="${el.dataset.factField}"]`);fields[fields.length-1].focus();return;}if(action==='remove-fact')reg.data[el.dataset.factField].splice(Number(el.dataset.factIndex),1);if(action==='close'){closeRegistration();return;}if(action==='sample'){reg.sample=true;reg.data=structuredClone(samplePosting);reg.step='review';}if(action==='continue'){if(reg.mode==='link'&&!validUrl(reg.url)){regError('http 또는 https 공고 링크를 입력해 주세요.');return;}if(reg.mode==='text'&&!reg.text.trim()){regError('공고 본문을 입력해 주세요.');return;}if(reg.mode==='image'&&!reg.files.length){regError('공고 스크린샷을 선택해 주세요.');return;}reg.data=reg.sample?freshPosting():reg.data||freshPosting();if(!reg.data.applicationUrl&&validUrl(reg.url))reg.data.applicationUrl=reg.url.trim();reg.sample=false;reg.step='review';}if(action==='manual'){reg.data=reg.sample?freshPosting():reg.data||freshPosting();if(!reg.data.applicationUrl&&validUrl(reg.url))reg.data.applicationUrl=reg.url.trim();reg.sample=false;reg.step='review';}if(action==='back')reg.step='input';if(action==='add-stage')reg.data.stages.push({id:'s-'+(++regSeq),name:''});if(action==='remove-stage')reg.data.stages=reg.data.stages.filter(s=>s.id!==el.dataset.stage);if(action==='up'||action==='down'){const i=reg.data.stages.findIndex(s=>s.id===el.dataset.stage),j=i+(action==='up'?-1:1);if(j>=0&&j<reg.data.stages.length)[reg.data.stages[i],reg.data.stages[j]]=[reg.data.stages[j],reg.data.stages[i]];}if(action==='add-question')reg.data.questions.push({prompt:'',limit:null,spaces:true});if(action==='remove-question')reg.data.questions.splice(Number(el.dataset.questionIndex),1);if(action==='save'||action==='write'){registerPosting(action==='write');return;}renderRegistration();});}
function showPosting(id){const a=find(id);home.hidden=true;editing.hidden=true;registration.hidden=false;registration.innerHTML=`<div class="ar-page"><header class="ar-top"><button type="button" class="ah-button cursor-interaction" data-close-posting>← 지원 현황</button><h1>${escapeText(a.company)}</h1><span class="ar-meta">${escapeText(a.role)}</span><span class="ar-apply-slot">${applicationLink(a.applicationUrl)}</span></header><div class="ar-preview-grid"><aside class="ar-original"><h2>등록한 원문</h2>${sourceMarkup(a.source)}</aside><section class="ar-form"><section class="ar-section"><h2>주요 업무</h2><div style="white-space:pre-wrap">${savedFacts(a.duties)}</div></section><section class="ar-section"><h2>자격 요건</h2><div style="white-space:pre-wrap">${savedFacts(a.requirements)}</div></section><section class="ar-section"><h2>채용 절차</h2>${a.stages.length?a.stages.map(s=>escapeText(s.name)).join(' → '):'미확인'}</section><section class="ar-section"><h2>자기소개서 문항</h2>${a.questions.length?a.questions.map((q,i)=>`<p>Q${i+1} ${escapeText(q.prompt)}</p>`).join(''):'미확인'}</section><button type="button" class="ah-button ah-primary cursor-interaction" data-posting-write>자소서 작성</button></section></div></div>`;registration.querySelector('[data-close-posting]').onclick=closeRegistration;registration.querySelector('[data-posting-write]').onclick=()=>{registration.hidden=true;openEditor(id);};}

renderHome();
if(hub.dataset.entry==='editor')openEditor('mono');
if(hub.dataset.entry==='registration')showRegistration();
if(hub.dataset.entry==='review'){reg.sample=true;reg.data=structuredClone(samplePosting);reg.step='review';showRegistration();}
})();
</script>
