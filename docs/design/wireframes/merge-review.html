<script>
(()=>{
const root=document.getElementById('janovel-merge-review');
const editorId=root.id||('application-editor-'+root.dataset.application);root.id=editorId;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const texts={
 q1a:'문서를 믿고 다시 찾을 수 있는 서비스를 만드는 일에 관심이 있습니다.\n\n문서 관리 프로젝트에서 데이터 저장 기능을 개발했습니다. 저장 이후에도 기록이 정확하게 남는지 확인하는 일이 중요하다고 느꼈습니다.\n\n이 경험을 문서 저장과 변경 이력을 다루는 업무로 이어가고 싶습니다.',
 q1b:'문서를 믿고 다시 찾을 수 있는 서비스를 만드는 일에 관심이 있습니다.\n\n문서 관리 프로젝트에서 정상 저장뿐 아니라 실패한 요청이 남기는 데이터까지 확인했습니다. 생성 대상을 먼저 기록하고 보상 경로를 마련하며, 사용자가 맡긴 기록을 끝까지 관리하는 일에 흥미를 느꼈습니다.\n\n이 경험을 문서 저장과 변경 이력을 다루는 업무로 이어가고 싶습니다.',
 q2:'서로 다른 저장소에 데이터를 저장할 때 일부 작업만 성공하는 상황을 다뤘습니다.\n\n실패한 요청의 데이터를 정리할 수 있도록 생성할 데이터의 식별자를 먼저 기록하고, 보상 작업을 재시도하는 구조를 설계했습니다.'
};
function question(id,title,prompt,versions,parent){return {id,title,prompt,versions,parent,draft:versions[parent].text,left:0,right:'draft',nextVersion:versions.length===1?2:3,messages:[],pending:null,review:null,applied:new Set(),composer:'',view:'write',branchLane:null,merge:null,recordForm:null,branches:Object.fromEntries([...new Set(versions.map(v=>v.lane))].map(lane=>[lane,{name:lane?'분기 '+lane:'기본',description:''}]))};}
const demoItems=[
 question('motivation','지원동기','지원한 이유를 작성해 주세요.',[
 {label:'v1',note:'첫 초안',parent:null,lane:0,text:texts.q1a},
 {label:'v2',note:'경험 보강',parent:0,lane:0,text:texts.q1b},
 {label:'v2-A',note:'다른 도입',parent:0,lane:1,text:texts.q1a.replace('문서를 믿고 다시 찾을 수 있는 서비스를 만드는 일에 관심이 있습니다.','수정한 기록이 쌓여도 정확한 제출본을 찾을 수 있는 서비스를 만들고 싶습니다.')}
 ],1),

function ask(q,text){if(q.pending)return;const source=q.draft,id=++requestSeq,label=snapshotLabel(q,source);q.messages.push({role:'user',text});q.pending=id;q.composer='';s.mobile='chat';s.rightClosed=false;s.notice='';render();
 setTimeout(()=>{
 const paragraphs=source.split('\n\n'),edited=q.id==='motivation'?'문서 관리 프로젝트에서 저장 성공 여부뿐 아니라 실패 후 남는 데이터까지 추적했습니다. 생성 대상을 먼저 기록하고 보상 작업을 재시도하도록 설계한 경험을, 사용자가 자신의 기록을 믿고 다시 찾는 기능으로 이어가고 싶습니다.':'생성할 데이터의 식별자를 먼저 기록해, 저장 도중 실패하더라도 정리 대상을 찾을 수 있도록 했습니다. 보상 작업이 실패할 때는 다시 실행할 수 있게 설계했습니다. 다만 지연된 원 요청과 보상 사이의 경합은 별도 한계로 남겼습니다.';
 const candidate=q.id.startsWith('registered-')?source:q.id==='motivation'?[paragraphs[0],edited,paragraphs.slice(2).join('\n\n')].filter(Boolean).join('\n\n'):[paragraphs[0],edited].join('\n\n');
 q.messages.push({role:'assistant',id,questionId:q.id,label,source,candidate,text:q.id.startsWith('registered-')?'공고의 업무·요건과 경험이 연결되는 부분을 구체적으로 설명해 보세요. 이 응답은 화면 확인용 예시이며 실제 AI 분석은 아닙니다.':q.id==='motivation'?'지원 이유는 드러나지만, 경험과 포부가 반복돼요. 어떤 문제를 끝까지 살폈는지 한 번만 구체적으로 연결해 보세요.':'무엇을 바꿨는지는 보여요. 실패했을 때 정리 대상을 어떻게 찾는지 설명하고, 해결하지 않은 한계는 구분해 두면 좋겠습니다.'});q.pending=null;render();
 },700);
}
function bind(){
 const q=current();root.querySelectorAll('button').forEach(el=>{if(!el.hasAttribute('type'))el.type='button';});
 const record=root.querySelector('[data-record-form]');if(record){record.onsubmit=e=>{e.preventDefault();commitRecord(q);render();};record.querySelectorAll('[data-record-field]').forEach(el=>{el.oninput=()=>{q.recordForm[el.dataset.recordField]=el.value;q.recordForm.focusField=el.dataset.recordField;};el.onfocus=()=>{q.recordForm.focusField=el.dataset.recordField;};if(el.tagName==='INPUT')el.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229){e.preventDefault();commitRecord(q);render();}};});root.querySelector('.p-record-dialog').oncancel=e=>{e.preventDefault();q.recordForm=null;render();};}
 const editor=root.querySelector('.p-editor');if(editor)editor.oninput=()=>{q.draft=editor.value;root.querySelector('[data-count]').textContent=countLabel(q);s.notice='';root.querySelector('.p-notice').textContent='';};
 const composer=root.querySelector('.p-compose textarea');composer.oninput=()=>{q.composer=composer.value;};composer.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.keyCode!==229){e.preventDefault();const t=composer.value.trim();if(t&&!q.pending){ask(q,t);root.querySelector('.p-compose textarea').focus();}}};
 root.querySelectorAll('[data-question]').forEach(el=>el.onclick=()=>{s.q=Number(el.dataset.question);s.notice='';render();root.querySelector(`[data-question="${s.q}"]`).focus();});
 root.querySelectorAll('button[data-mobile]').forEach(el=>el.onclick=()=>{s.mobile=el.dataset.mobile;render();});
 root.querySelectorAll('[data-version]').forEach(el=>el.onclick=()=>{if(el.dataset.version==='draft')q.view='write';else{q.left=Number(el.dataset.version);q.right='draft';q.view='history';}s.mobile='write';s.notice='';render();});
 root.querySelectorAll('[data-select]').forEach(el=>el.onchange=()=>{q[el.dataset.select]=el.dataset.select==='left'?Number(el.value):el.value;render();});
 root.querySelectorAll('[data-merge-select]').forEach(el=>el.onchange=()=>{resetMerge(q,el.dataset.mergeSelect==='left'?Number(el.value):q.merge.left,el.dataset.mergeSelect==='right'?Number(el.value):q.merge.right);render();});
 root.querySelectorAll('[data-merge-choice]').forEach(el=>el.onchange=()=>{q.merge.choices[Number(el.dataset.mergeChoice)]=el.value;updateMergeResult(q);render();});
 const merged=root.querySelector('[data-merge-result]');if(merged)merged.oninput=()=>{q.merge.result=merged.value;q.merge.manual=true;root.querySelectorAll('[data-merge-select],[data-merge-choice]').forEach(el=>el.disabled=true);root.querySelector('[data-action=reset-merge-result]').hidden=false;root.querySelector('[data-merge-count]').textContent=measure(q,merged.value)+'자';root.querySelector('[data-action=confirm-merge]').disabled=!mergeReady(q)||!merged.value.trim();};
 root.querySelectorAll('[data-review]').forEach(el=>el.onclick=()=>{q.review=q.messages.find(m=>m.id===Number(el.dataset.review));q.view='review';s.mobile='write';s.notice='';render();});
 root.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>{const a=el.dataset.action;s.notice='';
 if(a==='back-to-list'){root.returnToOverview?.();return;}
 if(a==='toggle-left')s.leftClosed=!s.leftClosed;
 if(a==='toggle-right')s.rightClosed=!s.rightClosed;
 if(a==='write')q.view='write';
 if(a==='history'){q.left=q.versions[q.parent].parent??q.parent;q.right='draft';q.view='history';}
 if(a==='save')openRecord(q,'snapshot');
 if(a==='branch'){if(dirty(q)){s.notice='작성 중인 내용을 먼저 스냅샷으로 남겨 주세요.';}else openRecord(q,'branch');}
 if(a==='merge')startMerge(q);
 if(a==='cancel-merge'){q.view=q.merge.returnView;q.merge=null;}
 if(a==='reset-merge-result')updateMergeResult(q);
 if(a==='confirm-merge'){if(!q.merge||!mergeReady(q)||!q.merge.result.trim())return;openRecord(q,'merge');}
 if(a==='dismiss-record')q.recordForm=null;
 if(a==='commit-record')commitRecord(q);
 if(a==='request'){ask(q,'이 문항의 피드백과 수정안을 부탁해.');return;}
 if(a==='apply'){const r=q.review;if(r.questionId!==q.id||q.applied.has(r.id)||q.draft!==r.source)return;openRecord(q,'ai');}
 render();if(a==='toggle-left'||a==='toggle-right')root.querySelector(`[data-action="${a}"]`).focus();});
}

const reviewQuestion=current();
reviewQuestion.versions[1].label='v3';
reviewQuestion.versions[1].name='직무 연결';
reviewQuestion.versions[2].label='v3-A';
reviewQuestion.versions[2].name='다른 도입';
reviewQuestion.nextVersion=4;
startMerge(reviewQuestion);
render();
})();
</script>
