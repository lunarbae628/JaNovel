<div id="application-overview" aria-label="지원 현황"><section class="ah-home"></section><section class="ah-editing" hidden><div class="ah-editors"></div></section><section class="ah-registration" hidden aria-label="공고 등록과 확인"></section></div>
<style>
#application-overview{color-scheme:light;--ah-paper:#fff;--ah-ink:#302B27;--ah-dim:#727272;--ah-line:#e6e6e6;--ah-soft:#f7f7f8;--ah-blue:#274690;--ah-active:#edf1fa;color:var(--ah-ink);background:var(--ah-paper);border:1px solid var(--ah-line);font:14px/1.7 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;min-height:700px;overflow-wrap:anywhere}
#application-overview *{box-sizing:border-box}
#application-overview [hidden]{display:none!important}
#application-overview .ah-home{padding:30px 30px 40px}
#application-overview .ah-heading{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-right:90px;margin-bottom:28px}
#application-overview h1{font-weight:600;letter-spacing:-.03em;font-size:24px;margin:0}
#application-overview .ah-demo{font-size:12px;color:var(--ah-dim)}
#application-overview .ah-toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;border-bottom:1px solid var(--ah-line);padding-bottom:14px}
#application-overview .ah-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#application-overview .ah-button{font:inherit;color:inherit;border:0;background:transparent;padding:7px 12px;border-radius:4px;min-height:36px}
#application-overview .ah-primary{background:var(--ah-blue);color:#fff}
#application-overview .ah-link{color:var(--ah-blue)}
#application-overview .ah-view[aria-pressed=true]{box-shadow:inset 0 -2px var(--ah-blue);color:var(--ah-blue);border-radius:0}
#application-overview .ah-select,#application-overview .ah-input{font:inherit;border:1px solid var(--ah-line);background:#fff;color:var(--ah-ink);padding:6px 8px;border-radius:4px;max-width:100%;min-width:0}
#application-overview .ah-label{font-size:12px;color:var(--ah-dim);display:flex;gap:8px;align-items:center}
#application-overview .ah-table{border-collapse:collapse;table-layout:fixed;width:100%;text-align:left}
#application-overview .ah-table th{font-size:12px;font-weight:400;color:var(--ah-dim);padding:15px 10px;border-bottom:1px solid var(--ah-line)}
#application-overview .ah-table td{padding:20px 10px;border-bottom:1px solid var(--ah-line);vertical-align:middle}
#application-overview .ah-table th:first-child,#application-overview .ah-table td:first-child{padding-left:0;width:34%}
#application-overview .ah-table th:nth-child(2){width:22%}#application-overview .ah-table th:nth-child(3){width:20%}
#application-overview .ah-company{display:block;padding:0;text-align:left;font:inherit;font-weight:500;color:var(--ah-ink);background:transparent;border:0}
#application-overview .ah-company:hover{text-decoration:underline;text-underline-offset:4px;color:var(--ah-blue)}
#application-overview .ah-role{display:block;font-size:12px;color:var(--ah-dim);margin-top:5px}
#application-overview .ah-date{font-variant-numeric:tabular-nums}#application-overview .ah-sub{display:block;font-size:12px;color:var(--ah-dim)}
#application-overview .ah-status{border:0;background:var(--ah-soft);padding:5px 8px;min-width:98px}
#application-overview .ah-empty{padding:40px 0;color:var(--ah-dim)}
#application-overview .ah-calendar-layout{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:24px;margin-top:24px}
#application-overview .ah-month-bar{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:14px}
#application-overview .ah-month-title{font-size:17px;font-weight:500}
#application-overview .ah-weekdays,#application-overview .ah-month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
#application-overview .ah-weekdays span{font-size:12px;color:var(--ah-dim);padding:8px;text-align:left}
#application-overview .ah-month{border-top:1px solid var(--ah-line);border-left:1px solid var(--ah-line)}
#application-overview .ah-day{font:inherit;color:inherit;display:flex;flex-direction:column;align-items:stretch;gap:5px;text-align:left;border:0;border-right:1px solid var(--ah-line);border-bottom:1px solid var(--ah-line);background:#fff;padding:9px 6px;min-height:91px;min-width:0}
#application-overview .ah-day[aria-pressed=true]{background:var(--ah-active);box-shadow:inset 0 0 0 1px #b7c5e5}
#application-overview .ah-outside{background:#fafafa;color:#a0a0a0}
#application-overview .ah-day-number{font-size:12px}
#application-overview .ah-event{font-size:11px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ah-ink);border-left:2px solid #b3b3b7;padding-left:4px}
#application-overview .ah-event[data-kind=면접],#application-overview .ah-event[data-kind=과제]{border-left-color:var(--ah-blue);color:var(--ah-blue)}
#application-overview .ah-agenda{border-left:1px solid var(--ah-line);padding-left:20px}
#application-overview .ah-agenda h2{font-size:14px;font-weight:500;margin:4px 0 18px}
#application-overview .ah-agenda-item{padding:0 0 16px;margin-bottom:16px;border-bottom:1px solid var(--ah-line)}
#application-overview .ah-agenda-meta{font-size:12px;color:var(--ah-dim);margin:6px 0}
#application-overview .ah-agenda-empty{font-size:13px;color:var(--ah-dim);padding:4px 0 24px}
#application-overview .ah-undated{margin-top:28px;padding-top:18px;border-top:1px solid var(--ah-line)}
#application-overview .ah-undated h2{font-size:13px;font-weight:500;margin:0 0 8px}
#application-overview .ah-form{margin:22px 0;padding:20px;background:var(--ah-soft)}
#application-overview .ah-fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:16px}
#application-overview .ah-fields label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ah-dim);min-width:0}
#application-overview .ah-error{color:#302B27;font-size:13px;margin-bottom:12px}
#application-overview .ah-feedback{min-height:24px;font-size:12px;color:var(--ah-dim);margin-top:12px}
#application-overview .application-editor{border:0}
@media(max-width:760px){#application-overview .ah-home{padding:24px 18px}#application-overview .ah-calendar-layout{grid-template-columns:1fr;gap:24px}#application-overview .ah-agenda{border-left:0;border-top:1px solid var(--ah-line);padding:18px 0 0}#application-overview .ah-fields{grid-template-columns:1fr 1fr}#application-overview .ah-table th:last-child,#application-overview .ah-table td:last-child{display:none}#application-overview .ah-table th:first-child{width:44%}#application-overview .ah-table th:nth-child(2){width:28%}#application-overview .ah-table th:nth-child(3){width:28%}}
@media(pointer:coarse){#application-overview .ah-button,#application-overview .ah-company,#application-overview .ah-select{min-height:44px}}
@media(max-width:450px){#application-overview .ah-home{padding:20px 12px}#application-overview .ah-heading{padding-right:85px}#application-overview h1{font-size:21px}#application-overview .ah-toolbar{gap:10px}#application-overview .ah-toolbar>.ah-row:last-child{width:100%;justify-content:space-between}#application-overview .ah-table td{padding:18px 4px}#application-overview .ah-table th{padding:14px 4px}#application-overview .ah-status{min-width:0;width:100%;font-size:12px;padding:5px 2px}#application-overview .ah-table th:first-child{width:40%}#application-overview .ah-table th:nth-child(2){width:30%}#application-overview .ah-table th:nth-child(3){width:30%}#application-overview .ah-date{font-size:12px}#application-overview .ah-day{padding:7px 2px;min-height:76px}#application-overview .ah-weekdays span{padding:6px 2px}#application-overview .ah-event{padding-left:2px}#application-overview .ah-fields{grid-template-columns:1fr}}
</style>
